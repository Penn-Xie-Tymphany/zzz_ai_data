[project]
name = "my-data-agent"
version = "0.1.0"
description = "Self-built Data Agent for KDD Cup 2026 (DataAgent-Bench) learning"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
